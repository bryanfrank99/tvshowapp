name: Build & Release TVShow (Android & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag o versión (ej. v6.15.0). Si se deja vacío, toma la de package.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APKs Android (Mobile & TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias de Android SDK
        run: yes | sdkmanager --licenses || true

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APKs (Mobile y TV) con Gradle
        run: |
          cd android
          ./gradlew :app:assembleMobileDebug :app:assembleTvDebug --no-daemon

      - name: Preparar APKs y determinar etiqueta de versión
        id: prep
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          
          mkdir -p output-apks
          SRC_MOBILE="android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk"
          SRC_TV="android/app/build/outputs/apk/tv/debug/app-tv-debug.apk"
          
          cp "$SRC_MOBILE" "output-apks/TVShow-Mobile-${TAG}.apk"
          cp "$SRC_TV" "output-apks/TVShow-TV-${TAG}.apk"

      - name: Subir artefactos Android
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: output-apks/*.apk
          retention-days: 1

  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar Instalador Windows con Electron Builder
        run: npx electron-builder --win nsis

      - name: Preparar Instalador Windows
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          
          mkdir -p output-windows
          cp dist/TVShow-Setup-*.exe output-windows/TVShow-Setup-${TAG}.exe

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output-windows/*.exe
          retention-days: 1

  publish-release:
    name: Publicar Release en GitHub
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout para metadatos
        uses: actions/checkout@v4

      - name: Descargar artefactos de Android
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-files

      - name: Descargar artefactos de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files

      - name: Determinar etiqueta de versión
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          ls -la release-files

      - name: Publicar Release en GitHub con todos los binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: TVShow ${{ steps.tag.outputs.TAG }}
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
